apiVersion: v1
kind: Service
metadata:
  name: {{ include "atm10.name" . }}
  labels:
    {{- include "atm10.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "atm10.selectorLabels" . | nindent 4 }}
  ports:
    - name: minecraft
      port: {{ .Values.service.port }}
      targetPort: minecraft
      protocol: TCP
      {{- if and (ne .Values.service.type "ClusterIP") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
